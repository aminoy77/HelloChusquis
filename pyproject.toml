[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hellochusquis"
version = "5.0"
description = "A powerful terminal AI agent with 54 AI providers, 150+ integrations, SSE streaming, browser automation, web UI, and auto-tool-builder"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "aminoy77"}
]
keywords = ["ai", "agent", "cli", "llm", "automation", "mcp", "tools", "browser", "playwright"]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "textual>=0.60.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "playwright>=1.40.0",
    "pyautogui>=0.9.54",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34.0",
]
voice = [
    "SpeechRecognition>=3.10.0",
]
watch = [
    "watchdog>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/aminoy77/HelloChusquis"

[project.scripts]
hellochusquis = "cli:main"

[tool.setuptools]
py-modules = ["main", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*", "ui*", "web*", "api*", "workspace*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"web" = ["*.html"]

[tool.ruff]
line-length = 120
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Errors that break execution or signal dead code. Style rules stay advisory for now.
select = ["E9", "F63", "F7", "F82", "F823", "F811"]
