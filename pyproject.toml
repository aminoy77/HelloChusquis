[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hellochusquis"
version = "1.4.2"
description = "A powerful terminal AI agent with 150+ integrations, 100+ functions, voice, browser automation, web UI, and auto-tool-builder"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "aminoy77"}
]
keywords = ["ai", "agent", "cli", "llm", "automation", "mcp", "tools", "browser", "playwright"]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "playwright>=1.40.0",
    "pyautogui>=0.9.54",
]

[project.urls]
Homepage = "https://github.com/aminoy77/HelloChusquis"

[project.scripts]
hellochusquis = "cli:main"

[tool.setuptools]
py-modules = ["main", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*", "ui*", "web*", "api*", "workspace*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"web" = ["*.html"]
