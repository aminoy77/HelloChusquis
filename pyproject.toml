[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hellochusquis"
version = "0.6.0"
description = "A powerful terminal AI agent with multi-provider fallback, plugin system, and web interface"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "aminoy77", email = "arnau@example.com"}
]
keywords = ["ai", "agent", "cli", "llm", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/aminoy77/HelloChusquis"
Repository = "https://github.com/aminoy77/HelloChusquis"

[project.scripts]
hellochusquis = "cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"web" = ["*.html"]