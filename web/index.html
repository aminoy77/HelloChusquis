<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloChusquis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #080807;
            --surface: #0f0f0d;
            --surface2: #161614;
            --amber: #f5a623;
            --amber-dim: #c4841c;
            --amber-glow: rgba(245, 166, 35, 0.08);
            --text: #e8e3d8;
            --text-muted: #6b6860;
            --text-dim: #3d3c39;
            --border: #1f1e1b;
            --green: #5eb97e;
            --blue: #7eb8d4;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1000;
            opacity: 0.3;
        }

        header {
            padding: 14px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--amber);
            font-style: italic;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-section h3 {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--amber);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            padding: 3px 0;
            color: var(--text-muted);
        }

        .indicator {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .indicator.ready { background: var(--green); }
        .indicator.exhausted { background: #ef4444; }
        .indicator.plugin { background: var(--blue); }

        .memory-stat {
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 2px 0;
            line-height: 1.6;
        }

        .memory-stat span { color: var(--text); }

        /* CHAT */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); }

        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 72%;
            animation: fadeUp 0.2s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; }

        .message-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0 2px;
        }

        .message.user .message-label {
            color: var(--text-muted);
            text-align: right;
        }

        .message.assistant .message-label {
            color: var(--amber);
        }

        .message-bubble {
            padding: 12px 16px;
            font-size: 0.825rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .message-bubble {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: white;
            border-right: 2px solid var(--text-muted);
        }

        .message.assistant .message-bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-left: 2px solid var(--amber);
        }

        .tool-calls {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .tool-call {
            font-size: 0.68rem;
            color: var(--text-dim);
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 4px 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .tool-call.success { border-left: 2px solid var(--green); color: var(--text-muted); }
        .tool-call.error { border-left: 2px solid #ef4444; }

        .thinking {
            align-self: flex-start;
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 2px solid var(--amber);
        }

        .thinking span {
            width: 5px;
            height: 5px;
            background: var(--amber);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
            opacity: 0.4;
        }

        .thinking span:nth-child(2) { animation-delay: 0.15s; }
        .thinking span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        /* INPUT */
        .input-area {
            padding: 16px 40px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 10px 16px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.825rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: rgba(245, 166, 35, 0.3);
        }

        .input-area input::placeholder { color: var(--text-dim); }

        .input-area button {
            background: var(--amber);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover { background: var(--amber-dim); }
        .input-area button:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; }

        .welcome {
            align-self: center;
            text-align: center;
            margin: auto;
        }

        .welcome h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            font-style: italic;
            color: var(--amber);
            margin-bottom: 8px;
        }

        .welcome p {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .welcome-hint {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hint-item {
            font-size: 0.7rem;
            color: var(--text-dim);
            padding: 6px 12px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .hint-item span { color: var(--amber); }
    </style>
</head>
<body>
    <header>
        <div class="header-logo">HelloChusquis</div>
        <div class="header-status">
            <div class="status-dot"></div>
            <span>Ready</span>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <h3>Providers</h3>
                <div id="providers-list"><div class="sidebar-item">Loading...</div></div>
            </div>
            <div class="sidebar-section">
                <h3>Plugins</h3>
                <div id="plugins-list"><div class="sidebar-item">Loading...</div></div>
            </div>
            <div class="sidebar-section">
                <h3>Memory</h3>
                <div id="memory-info"><div class="memory-stat">Loading...</div></div>
            </div>
            <div class="sidebar-section">
                <h3>Learnings</h3>
                <div id="learnings-info"><div class="memory-stat">Loading...</div></div>
            </div>
        </aside>

        <div class="chat-area">
            <div class="messages" id="messages">
                <div class="welcome">
                    <h2>HelloChusquis</h2>
                    <p>Terminal AI Agent</p>
                    <div class="welcome-hint">
                        <div class="hint-item"><span>/help</span> — show commands</div>
                        <div class="hint-item"><span>/status</span> — provider status</div>
                        <div class="hint-item"><span>/clear</span> — clear history</div>
                        <div class="hint-item"><span>👍 / 👎</span> — give feedback</div>
                    </div>
                </div>
            </div>
            <div class="input-area">
                <input
                    type="text"
                    id="input"
                    placeholder="Type a message..."
                    autocomplete="off"
                />
                <button id="send-btn" onclick="sendMessage()">Send →</button>
            </div>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');

        async function loadStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();

                document.getElementById('providers-list').innerHTML = data.providers.map(p => `
                    <div class="sidebar-item">
                        <div class="indicator ${p.status}"></div>
                        <span>${p.name}</span>
                    </div>
                `).join('');

                document.getElementById('plugins-list').innerHTML = data.plugins.length
                    ? data.plugins.map(p => `
                        <div class="sidebar-item">
                            <div class="indicator plugin"></div>
                            <span>${p.name}</span>
                        </div>
                    `).join('')
                    : '<div class="sidebar-item" style="color:var(--text-dim)">No plugins</div>';

                document.getElementById('memory-info').innerHTML = `
                    <div class="memory-stat">Sessions: <span>${data.memory.sessions}</span></div>
                    <div class="memory-stat">Summary: <span>${data.memory.summary ? 'Available' : 'None yet'}</span></div>
                `;

                document.getElementById('learnings-info').innerHTML = `
                    <div class="memory-stat">Patterns: <span>${data.learnings.patterns}</span></div>
                    <div class="memory-stat">Rules: <span>${data.learnings.improvements}</span></div>
                `;
            } catch(e) {}
        }

        function addMessage(role, content, toolCalls = []) {
            const welcome = document.querySelector('.welcome');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;

            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = role === 'user' ? 'You' : 'HelloChusquis';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;

            div.appendChild(label);
            div.appendChild(bubble);

            if (toolCalls.length > 0) {
                const tcDiv = document.createElement('div');
                tcDiv.className = 'tool-calls';
                toolCalls.forEach(tc => {
                    const tcEl = document.createElement('div');
                    tcEl.className = `tool-call ${tc.success ? 'success' : 'error'}`;
                    const argsStr = Object.entries(tc.args).map(([k,v]) => `${k}=${JSON.stringify(v)}`).join(', ');
                    tcEl.textContent = `→ ${tc.tool}(${argsStr})`;
                    tcDiv.appendChild(tcEl);
                });
                div.appendChild(tcDiv);
            }

            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addThinking() {
            const div = document.createElement('div');
            div.className = 'thinking';
            div.id = 'thinking';
            div.innerHTML = '<span></span><span></span><span></span>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            sendBtn.disabled = true;
            addMessage('user', text);

            const thinking = addThinking();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                thinking.remove();
                addMessage('assistant', data.response, data.tool_calls || []);
                loadStatus();
            } catch(e) {
                thinking.remove();
                addMessage('assistant', 'Connection error. Is the server running?');
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        loadStatus();
        setInterval(loadStatus, 30000);
    </script>
</body>
</html>
