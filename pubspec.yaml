name: study_flow
description: "A cross-platform Flutter app for study management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  flutter_riverpod: ^2.5.1
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.2.2
  fl_chart: ^0.68.0
  timezone: ^0.9.4
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  app_links: 6.3.0

flutter:
  uses-material-design: true
  generate: true